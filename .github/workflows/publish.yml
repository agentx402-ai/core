name: Publish to npm

# Publishes @agentx402-ai/core to npm on a published GitHub Release, using OIDC
# Trusted Publishing — NO npm token. Provenance attestations emitted automatically.
#
# One-time setup: configure a Trusted Publisher at npmjs.com → @agentx402-ai/core →
# Settings → Trusted Publisher → GitHub Actions → repo "agentx402-ai/core", workflow
# "publish.yml". Bump the version before cutting the Release.

on:
  release:
    types: [published]
  # Manual re-run path: a release-event rerun reuses the workflow file snapshotted
  # at the tag's commit, so a fixed workflow on main needs its own trigger.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1 (required for OIDC trusted publishing)
          # NATIVELY. Do not reintroduce `npm install -g npm@latest`: npm
          # overwriting itself in-place is what corrupted the bundle on agentkv's
          # first v0.2.0 publish attempt (provenance.js → missing 'sigstore').
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version # publish provenance path needs an intact npm bundle
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
